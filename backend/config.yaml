# Прикладная (не секретная) конфигурация платформы.
# Секреты и инфраструктурные настройки — в .env.

app:
  name: "video-surveillance"
  version: "0.1.0"

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"

# Фаза 5: пороги бизнес-логики и обработки событий.
thresholds:
  # Минимальное время нахождения человека в зоне до фиксации нарушения (сек).
  zone_stay_seconds: 3
  # Сколько секунд держать состояние трека после последнего события, прежде
  # чем считать, что человек покинул зону/кадр (для дедупликации).
  presence_ttl_seconds: 30
ppe_classes: []
cameras: []