# Прикладная (не секретная) конфигурация CV-воркера.
# Секреты и инфраструктурные настройки — в .env.

worker:
  # Частота анализа: обрабатываем каждый N-й кадр.
  # При fps=30 и N=30 анализируется 1 кадр в секунду.
  analyze_every_n: 30
  fps: 30

# Обязательные классы детекции из ТЗ.
detection_classes:
  - person
  - helmet
  - safety_vest